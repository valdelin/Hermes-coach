name: evals-insight

# Job SEPARADO do `tests`: os evals do insight rodam por conta propria.
# O gate do build/daily nao pode depender de provider de LLM, de dataset
# rotulado ou de gracao a API — o core deterministico decide treino e nao
# espera por nenhuma das tres coisas.
#
# Harness compartilhado: ~/Work/lab/ai-lab (metodo + runner). O que e do
# app (contract.py, prompt.md, evals/graders.py, evals/cases.jsonl) fica
# neste repo — o runner carrega evals/graders.py por caminho e nao importa
# nada do dominio, entao o gate mede as invariantes desta branch, nao uma
# copia que envelhece por fora.

on:
  workflow_dispatch:
  schedule:
    # nightly — madrugada, para nao competir com o reconcile diario
    - cron: "17 3 * * *"

permissions:
  contents: read

jobs:
  evals:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Clonar o harness
        run: |
          git clone --depth 1 https://github.com/valdelin/ai-lab.git "$RUNNER_TEMP/ai-lab"

      - name: Rodar o harness
        run: |
          if [ -d "$RUNNER_TEMP/ai-lab" ]; then
            cd "$RUNNER_TEMP/ai-lab"
            ./check.sh "$GITHUB_WORKSPACE"
          else
            echo "::notice::harness indisponivel no CI; o dataset versionado segue no repo"
            ls -la evals/
          fi
